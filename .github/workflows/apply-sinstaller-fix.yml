name: Apply sInstaller self-update fix

on:
  push:
    branches:
      - automation/apply-sinstaller-fix

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: automation/apply-sinstaller-fix
          path: helper

      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/sinstaller-self-update
          fetch-depth: 0
          path: target

      - name: Apply tested RomFS lifecycle fix
        working-directory: target
        run: python3 ../helper/.github/workflows/apply_sinstaller_fix.py

      - name: Commit fix
        working-directory: target
        run: |
          git config user.name "5l4k"
          git config user.email "58014287+5l4k@users.noreply.github.com"
          git add projects/sInstaller/source/main.cpp
          git diff --cached --check
          git commit -m "Fix sInstaller self-update from installed path"
          git push origin HEAD:fix/sinstaller-self-update
